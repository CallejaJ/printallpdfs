<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PrintAllPDFs</title>
<meta name="description" content="Merge many PDFs in your browser and print them all through a single print dialog. Files never leave your computer.">
<link rel="icon" href="images/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="images/favicon.svg">
<meta name="theme-color" content="#0f172a">
<script>(function(){try{var t=localStorage.getItem('theme');if(t!=='light'&&t!=='dark'){t=window.matchMedia('(prefers-color-scheme: light)').matches?'light':'dark';}document.documentElement.dataset.theme=t;}catch(e){document.documentElement.dataset.theme='dark';}})();</script>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header class="site-header">
  <div class="header-inner">
    <div class="brand-row">
      <img class="brand-logo" src="images/logo.svg" alt="PrintAllPDFs">
      <span class="header-title">PrintAll<span class="header-title-accent">PDFs</span></span>
      <span class="beta-badge">Beta</span>
    </div>
    <div class="header-actions">
      <div class="lang-toggle" role="group" aria-label="Language">
        <button class="lang-btn" data-lang="es" type="button">ES</button>
        <button class="lang-btn" data-lang="en" type="button">EN</button>
      </div>
      <button id="theme" class="theme-toggle" type="button"></button>
    </div>
  </div>
</header>
<div class="page-intro">
  <p class="header-legend" data-i18n="legend"></p>
</div>

<main class="wrap">
  <div class="grid">
    <section class="panel">
      <h2 data-i18n="filesTitle"></h2>
      <p class="panel-sub" data-i18n="filesSub"></p>

      <div id="drop" tabindex="0" role="button" data-i18n-aria="dropAria">
        <svg class="drop-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5"/><path d="M12 17v-6M9 14l3-3 3 3"/></svg>
        <strong data-i18n="dropTitle"></strong>
        <span data-i18n="dropSub"></span>
        <small class="drop-limit" data-i18n="dropLimit"></small>
      </div>
      <input id="file" type="file" accept="application/pdf,.pdf" multiple hidden>

      <div class="queue-head">
        <span id="queueCount"></span>
        <button id="clear" class="link" type="button" data-i18n="clear" disabled></button>
      </div>
      <ul id="list"></ul>
    </section>

    <aside class="panel">
      <h2 data-i18n="optionsTitle"></h2>
      <p class="panel-sub" data-i18n="optionsSub"></p>

      <div class="field-pair">
        <div class="field">
          <label for="sort" data-i18n="order"></label>
          <select id="sort">
            <option value="manual" data-i18n="orderManual"></option>
            <option value="name" data-i18n="orderName"></option>
            <option value="date" data-i18n="orderDate"></option>
          </select>
        </div>
        <div class="field">
          <label for="copies" data-i18n="copies"></label>
          <input id="copies" type="number" min="1" max="50" value="1">
        </div>
      </div>

      <label class="switch">
        <input id="blank" type="checkbox">
        <span><span data-i18n="blank"></span><small data-i18n="blankHint"></small></span>
      </label>

      <div class="summary">
        <div class="stat"><b id="statFiles">0</b><span data-i18n="statFiles"></span></div>
        <div class="stat"><b id="statPages">0</b><span data-i18n="statPages"></span></div>
        <div class="stat"><b id="statSheets">0</b><span data-i18n="statTotal"></span></div>
      </div>

      <div id="sizeWarn" class="size-warn" role="alert" hidden>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"/><path d="M12 9v4M12 17h.01"/></svg>
        <span id="sizeWarnText"></span>
      </div>

      <div class="actions">
        <button id="print" class="primary" type="button" disabled>
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9V3h12v6"/><rect x="3" y="9" width="18" height="8" rx="2"/><path d="M7 14h10v7H7z"/></svg>
          <span data-i18n="print"></span>
        </button>
        <button id="download" class="secondary" type="button" disabled>
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v12M7 10l5 5 5-5"/><path d="M5 21h14"/></svg>
          <span data-i18n="download"></span>
        </button>
      </div>
      <p id="status" aria-live="polite"></p>

      <div class="privacy">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>
        <span data-i18n="privacy"></span>
      </div>
    </aside>
  </div>

  <section class="how" aria-labelledby="howTitle">
    <h2 id="howTitle" class="section-title" data-i18n="howTitle"></h2>
    <p class="section-sub" data-i18n="howSub"></p>
    <div class="steps">
      <article class="step">
        <span class="step-num">1</span>
        <h3 data-i18n="step1Title"></h3>
        <p data-i18n="step1Body"></p>
      </article>
      <article class="step">
        <span class="step-num">2</span>
        <h3 data-i18n="step2Title"></h3>
        <p data-i18n="step2Body"></p>
      </article>
      <article class="step">
        <span class="step-num">3</span>
        <h3 data-i18n="step3Title"></h3>
        <p data-i18n="step3Body"></p>
      </article>
    </div>
  </section>

  <section class="panel help" aria-labelledby="helpTitle">
    <h2 id="helpTitle" data-i18n="helpTitle"></h2>
    <p class="panel-sub" data-i18n="helpSub"></p>
    <div class="help-grid">
        <p><b data-i18n="help1Title"></b> <span data-i18n="help1Body"></span></p>
        <p><b data-i18n="help2Title"></b> <span data-i18n="help2Body"></span></p>
        <p><b data-i18n="help3Title"></b> <span data-i18n="help3Body"></span></p>
        <p><b data-i18n="help4Title"></b> <span data-i18n="help4Body"></span></p>
        <p><b data-i18n="help5Title"></b> <span data-i18n="help5Body"></span></p>
        <p><b data-i18n="help6Title"></b> <span data-i18n="help6Body"></span></p>
    </div>
  </section>
</main>

<footer class="site-footer">
  <span>© <span id="year"></span> · <a href="https://jorgecalleja.dev" target="_blank" rel="noopener noreferrer">Diseño Web Málaga</a> · v1.0.0 · <span data-i18n="footerBeta"></span></span>
</footer>

<iframe id="frame" title="Print preview" aria-hidden="true" tabindex="-1"></iframe>

<script src="https://cdn.jsdelivr.net/npm/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>
<script>window.PDFLib || document.write('<script src="vendor/pdf-lib.min.js"><\/script>');</script>
<script src="app.js"></script>
</body>
</html>
