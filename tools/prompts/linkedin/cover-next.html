<!doctype html>
<html lang="es"><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--navy:#0f172a;--teal:#0d9488;--muted:#64748b}
*{box-sizing:border-box;margin:0}
body{width:800px;height:800px;font-family:Inter,sans-serif;color:var(--navy);position:relative;overflow:hidden;
 background:radial-gradient(ellipse 60% 40% at 90% 8%,rgba(45,212,191,.14),transparent 70%),#f1f5f9}
body::before{content:"";position:absolute;inset:0;background-image:radial-gradient(rgba(100,116,139,.28) 1px,transparent 1.4px);background-size:16px 16px}
.c{position:absolute;left:60px;right:60px}
.kicker{top:62px;font-size:13px;font-weight:700;letter-spacing:2.6px;color:var(--teal)}
h1{top:86px;font-size:39px;line-height:1.18;font-weight:800;letter-spacing:-1px}
h1 span{color:var(--teal)}
.win{top:208px;border-radius:12px;background:#fff;border:1px solid #e2e8f0;box-shadow:0 26px 50px -20px rgba(15,23,42,.4);overflow:hidden}
.bar{height:34px;background:#f1f5f9;border-bottom:1px solid #e2e8f0;display:flex;align-items:center;padding:0 14px;gap:7px}
.dot{width:9px;height:9px;border-radius:50%}
.url{margin:0 auto;transform:translateX(-24px);width:360px;height:22px;border-radius:11px;background:#fff;border:1px solid #e2e8f0;display:flex;align-items:center;justify-content:center;gap:6px;font-family:'JetBrains Mono';font-size:11.5px;color:#334155}
.win img{display:block;width:100%}
.tags{top:678px;display:flex;gap:8px;flex-wrap:wrap}
.tag{font-size:11px;font-weight:600;color:#0f766e;background:rgba(13,148,136,.09);border:1px solid rgba(13,148,136,.25);padding:4px 10px;border-radius:999px}
.foot{top:724px;display:flex;align-items:center;gap:12px}
.flogo{width:32px;height:32px;border-radius:8px;background:var(--navy);display:flex;align-items:center;justify-content:center}
.fb b{display:block;font-size:16px;font-weight:700}
.fb small{font-family:'JetBrains Mono';font-size:9.5px;letter-spacing:2px;color:var(--muted)}
.site{margin-left:auto;font-family:'JetBrains Mono';font-size:12px;color:#334155}
.pill{margin-left:12px;background:var(--teal);color:#fff;font-weight:700;font-size:13px;padding:7px 14px;border-radius:999px}
</style></head><body>
<div class="c kicker">NUEVO · BETA GRATUITA</div>
<h1 class="c">Albaranes de 3 MB,<br>en <span>lotes</span> y <span>sin atascos</span>.</h1>
<div class="c win">
  <div class="bar"><i class="dot" style="background:#ff5f57"></i><i class="dot" style="background:#febc2e"></i><i class="dot" style="background:#28c840"></i>
    <div class="url">🔒 printallpdfs.vercel.app</div></div>
  <img src="app-shot.png" alt="">
</div>
<div class="c tags">
  <span class="tag">Lotes de 5, 10 o 20</span><span class="tag">Arrastrar para ordenar</span><span class="tag">Doble cara</span><span class="tag">Copias sin engordar el PDF</span><span class="tag">Nada se sube</span>
</div>
<div class="c foot">
  <div class="flogo"><img src="../../../public/images/logo.svg" width="24" height="24" alt=""></div>
  <div class="fb"><b>PrintAllPDFs</b><small>ALBARANES B2B · BETA</small></div>
  <span class="site">printallpdfs.vercel.app</span>
  <span class="pill">Beta gratuita</span>
</div>
</body></html>
